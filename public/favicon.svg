<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AM monogram">
  <style>
    .bg { fill: #111111; }
    .fg { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #ffffff; }
      .fg { fill: #111111; }
    }
  </style>
  <rect class="bg" width="64" height="64" rx="6" />
  <text
    class="fg"
    x="32"
    y="44"
    text-anchor="middle"
    font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="30"
    font-weight="800"
    letter-spacing="-2"
  >AM</text>
</svg>
